# 飞行模拟 CTF · 判决规则配置
# ⚠ 正式比赛前必须用 P0 基线数据校准阈值

telemetry:
  rate_hz: 30          # generic output 遥测频率
mp:
  rate_hz: 10          # multiplayer 位置包频率（FG 默认）

session:
  close_idle_s: 30     # 会话空闲多久后判定收口
  heartbeat_hz: 1
  grace_missed: 5

flag1:
  # 上海浦东机场 ZSPD → 上科大张江校区
  airport: "ZSPD"
  thr_lat: 31.1434
  thr_lon: 121.8050
  target_lat: 31.1770
  target_lon: 121.5960
  radius_m: 500.0      # 到达上科大判定半径
  ceil_ft: 1000.0      # 高度上限（防止高空飞掠）
  dur_s: 5.0           # 持续时长要求
  # ATC语音下发参数
  atc_audio_base64: ""  # 运行时注入，包含flag key
  decryption_hint: "base64_decode_and_xor"  # 提示用户解密方式

flag2:
  # 物理不可能状态判定（原flag3）
  soar_alt_ft: 100000.0
  soar_dur_s: 10.0
  dig_agl_ft: -300.0
  dig_dur_s: 10.0
  vne_kias: 163.0        # c172p 的 VNE，换机型时必须改
  speed_factor: 3.0
  speed_dur_s: 15.0
  max_accel_g: 50.0      # 相邻帧差分加速度上限（防瞬移）
