# 飞行模拟 CTF · 判决规则配置（示例值，正式比赛前必须用 P0 基线数据校准）
#
# ⚠ 所有阈值都是"占位值"：开发环境用的是虚构机场 (36.1500, -115.1500)，
#   部署前请换成实际场地坐标，并按《开发计划》P0 用 stock AP 跑 20 次基线重校。

telemetry:
  rate_hz: 30          # generic output 遥测频率
mp:
  rate_hz: 10          # multiplayer 位置包频率（FG 默认）

session:
  close_idle_s: 30     # 会话空闲多久后判定收口
  heartbeat_hz: 1
  grace_missed: 5

flag1:
  # 虚构机场：跑道 36，五边朝北飞 (course 360)
  airport: "DEV-FIELD RWY 36 (虚构，部署时替换)"
  thr_lat: 36.150000
  thr_lon: -115.150000
  thr_alt_ft: 2000.0
  course_deg: 360.0
  # 阈值（原 doc3 §1.3，逐条保留了原值）
  vs_tol_fps: 2.5        # 150 fpm ≈ 2.5 fps
  roll_tol_deg: 5.0
  lateral_tol_m: 5.0
  gs_stable_norm: 0.30   # |下滑道指针| < 0.3 视为"在下滑道上"
  stable_ratio_min: 0.90 # 10nm 内 ≥90% 时间在下滑道上 → 稳定进近分
  gs_dist_start_m: 18520.0  # 10 nm
  gs_full_scale_deg: 0.7    # ILS 满刻度偏差角（≈0.7°），指针归一化用
  dec_alt_ft: 200.0      # 决断高度 200ft
  dec_min_agl_ft: 30.0   # 修正：低于 30ft 的帧不算"偏离"（此时正常拉飘会打满指针）
  unstable_norm: 0.80
  bounce_agl_ft: 3.0
  bounce_window_s: 2.0

flag2:
  radius_m: 2000.0       # 水平半径
  ceil_ft: 8000.0        # 高度上限
  dur_s: 10.0            # 持续时长
  max_gap_s: 0.5         # 连续性：轨迹空洞超过该值即断开
  move_away_min_m: 500.0 # 触发后 3s 必须离开 ≥500m（防"擦边悬停"）
  # 下面是开发占位目标点：测试绕圈的实际圆心是 (36.10, -115.28333)
  # （圆心在起点以西 8nm），取其正北 8nm 圆上点为目标（arc 在 t≈255s 穿过）。
  # 正式部署时由 per-user 谜题生成器派生（见 tools/ctf2gen.py），写入会话。
  target_lat: 36.219500
  target_lon: -115.283333

flag3:
  soar_alt_ft: 100000.0
  soar_dur_s: 10.0
  dig_agl_ft: -300.0
  dig_dur_s: 10.0
  vne_kias: 163.0        # c172p 的 VNE，换机型时必须改
  speed_factor: 3.0
  speed_dur_s: 15.0
  max_accel_g: 50.0      # 相邻帧差分加速度上限（防瞬移）
